<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Co-adaptive social agent loop</title>
  <desc id="desc">A long-lived social agent learns through interaction, interpretation, validation, memory, skill, policy, identity, and evaluation updates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .actor { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 12; }
      .agent { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; rx: 12; }
      .rel { fill: #fff1f2; stroke: #be123c; stroke-width: 2; rx: 12; }
      .store { fill: #fef3c7; stroke: #a16207; stroke-width: 1.8; rx: 10; }
      .gov { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 1.8; rx: 10; }
      .eval { fill: #ffffff; stroke: #334155; stroke-width: 1.8; rx: 10; }
      .title { font: 19px Arial, sans-serif; font-weight: 700; fill: #0f172a; }
      .text { font: 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="960" height="640"/>
  <text class="title" x="480" y="44" text-anchor="middle">Co-adaptive social agency requires negotiated learning and governed persistence</text>

  <rect class="actor" x="80" y="105" width="220" height="80"/>
  <text class="text" x="190" y="137" text-anchor="middle">Human user</text>
  <text class="small" x="190" y="162" text-anchor="middle">goals, corrections, consent</text>

  <rect class="agent" x="660" y="105" width="220" height="80"/>
  <text class="text" x="770" y="137" text-anchor="middle">Social agent</text>
  <text class="small" x="770" y="162" text-anchor="middle">role, actions, restraint</text>

  <rect class="rel" x="350" y="95" width="260" height="100"/>
  <text class="text" x="480" y="127" text-anchor="middle">Interaction</text>
  <text class="small" x="480" y="153" text-anchor="middle">dialogue, task work, social cues</text>
  <text class="small" x="480" y="173" text-anchor="middle">shared activity over time</text>

  <rect class="eval" x="350" y="255" width="260" height="84"/>
  <text class="text" x="480" y="287" text-anchor="middle">Interpret and validate</text>
  <text class="small" x="480" y="312" text-anchor="middle">facts, inferences, hypotheses</text>

  <rect class="store" x="70" y="410" width="250" height="110"/>
  <text class="text" x="195" y="442" text-anchor="middle">Persistent memory</text>
  <text class="small" x="195" y="468" text-anchor="middle">episodic, semantic, relational</text>
  <text class="small" x="195" y="489" text-anchor="middle">provenance, confidence, expiry</text>

  <rect class="gov" x="355" y="410" width="250" height="110"/>
  <text class="text" x="480" y="442" text-anchor="middle">Identity and norms</text>
  <text class="small" x="480" y="468" text-anchor="middle">role, boundaries, permissions</text>
  <text class="small" x="480" y="489" text-anchor="middle">stable core, slow adaptation</text>

  <rect class="store" x="640" y="410" width="250" height="110"/>
  <text class="text" x="765" y="442" text-anchor="middle">Skills and policies</text>
  <text class="small" x="765" y="468" text-anchor="middle">procedures, strategies, safeguards</text>
  <text class="small" x="765" y="489" text-anchor="middle">versioned, tested, revisable</text>

  <rect class="eval" x="350" y="560" width="260" height="48"/>
  <text class="text" x="480" y="590" text-anchor="middle">Longitudinal evaluation</text>

  <path class="arrow" d="M300 145 L350 145"/>
  <path class="arrow" d="M610 145 L660 145"/>
  <path class="arrow" d="M770 185 C700 235 610 260 610 297"/>
  <path class="arrow" d="M480 195 L480 255"/>
  <path class="arrow" d="M400 339 C315 370 250 385 195 410"/>
  <path class="arrow" d="M480 339 L480 410"/>
  <path class="arrow" d="M560 339 C645 370 710 385 765 410"/>
  <path class="arrow" d="M195 520 C260 555 325 575 350 584"/>
  <path class="arrow" d="M480 520 L480 560"/>
  <path class="arrow" d="M765 520 C700 555 635 575 610 584"/>
  <path class="dash" d="M350 584 C190 560 135 280 190 185"/>
  <path class="dash" d="M610 584 C770 560 825 280 770 185"/>
</svg>
