<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" role="img" aria-labelledby="title desc">
  <title id="title">Adaptation ladder for social AI agents</title>
  <desc id="desc">A ladder from fixed model to contextual adaptation, memory adaptation, relationship adaptation, skill adaptation, policy adaptation, self-modification, and continual model learning.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .rung { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 8; }
    .frontier { fill: #ecfdf5; stroke: #15803d; stroke-width: 1.8; rx: 8; }
    .risk { fill: #fff1f2; stroke: #be123c; stroke-width: 1.8; rx: 8; }
    .text { font: 15px Arial, sans-serif; fill: #0f172a; }
    .small { font: 12.5px Arial, sans-serif; fill: #334155; }
    .title { font: 18px Arial, sans-serif; font-weight: 700; fill: #0f172a; }
    .axis { stroke: #334155; stroke-width: 2; }
  </style>
  <rect class="bg" width="860" height="620"/>
  <text class="title" x="430" y="42" text-anchor="middle">Adaptation becomes more powerful and harder to govern as it rises</text>
  <line class="axis" x1="145" y1="520" x2="145" y2="105"/>
  <text class="small" x="90" y="130" text-anchor="middle" transform="rotate(-90 90 130)">more plastic</text>
  <text class="small" x="90" y="500" text-anchor="middle" transform="rotate(-90 90 500)">more stable</text>

  <rect class="rung" x="190" y="485" width="500" height="44"/>
  <text class="text" x="215" y="512">Level 0: fixed model and fixed prompt</text>
  <rect class="rung" x="190" y="425" width="500" height="44"/>
  <text class="text" x="215" y="452">Level 1: contextual adaptation within the current interaction</text>
  <rect class="rung" x="190" y="365" width="500" height="44"/>
  <text class="text" x="215" y="392">Level 2: memory-based adaptation across interactions</text>
  <rect class="frontier" x="190" y="305" width="500" height="44"/>
  <text class="text" x="215" y="332">Level 3: relationship adaptation through shared history</text>
  <rect class="frontier" x="190" y="245" width="500" height="44"/>
  <text class="text" x="215" y="272">Level 4: skill adaptation and procedural refinement</text>
  <rect class="frontier" x="190" y="185" width="500" height="44"/>
  <text class="text" x="215" y="212">Level 5: strategy and policy adaptation</text>
  <rect class="risk" x="190" y="125" width="500" height="44"/>
  <text class="text" x="215" y="152">Level 6: self-modification of goals or identity structures</text>
  <rect class="risk" x="190" y="65" width="500" height="44"/>
  <text class="text" x="215" y="92">Level 7: continual learning in model weights</text>

  <text class="small" x="440" y="565" text-anchor="middle">For long-lived social agents, the main design frontier is often Levels 3-5.</text>
</svg>
