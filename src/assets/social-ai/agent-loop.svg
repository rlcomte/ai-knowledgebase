<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The recurrent agent loop</title>
  <desc id="desc">A circular flow from perceive to interpret, retrieve, decide, act, observe, evaluate, adapt, and repeat.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .node { fill: #f8fafc; stroke: #334155; stroke-width: 1.8; rx: 9; }
      .center { fill: #ecfeff; stroke: #0f766e; stroke-width: 2; rx: 10; }
      .text { font: 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="900" height="520"/>
  <rect class="center" x="330" y="220" width="240" height="78"/>
  <text class="text" x="450" y="252" text-anchor="middle">Current state</text>
  <text class="small" x="450" y="276" text-anchor="middle">goals + context + memory + policy</text>

  <rect class="node" x="390" y="40" width="120" height="52"/>
  <text class="text" x="450" y="72" text-anchor="middle">Perceive</text>

  <rect class="node" x="630" y="110" width="120" height="52"/>
  <text class="text" x="690" y="142" text-anchor="middle">Interpret</text>

  <rect class="node" x="705" y="235" width="120" height="52"/>
  <text class="text" x="765" y="267" text-anchor="middle">Retrieve</text>

  <rect class="node" x="630" y="365" width="120" height="52"/>
  <text class="text" x="690" y="397" text-anchor="middle">Decide</text>

  <rect class="node" x="390" y="425" width="120" height="52"/>
  <text class="text" x="450" y="457" text-anchor="middle">Act</text>

  <rect class="node" x="150" y="365" width="120" height="52"/>
  <text class="text" x="210" y="397" text-anchor="middle">Observe</text>

  <rect class="node" x="75" y="235" width="120" height="52"/>
  <text class="text" x="135" y="267" text-anchor="middle">Evaluate</text>

  <rect class="node" x="150" y="110" width="120" height="52"/>
  <text class="text" x="210" y="142" text-anchor="middle">Adapt</text>

  <path class="arrow" d="M510 66 C575 70 616 89 654 112"/>
  <path class="arrow" d="M724 162 C747 184 760 208 764 235"/>
  <path class="arrow" d="M764 287 C758 318 741 344 718 366"/>
  <path class="arrow" d="M630 405 C592 430 554 445 510 451"/>
  <path class="arrow" d="M390 451 C336 444 301 428 269 405"/>
  <path class="arrow" d="M181 365 C158 341 142 315 136 287"/>
  <path class="arrow" d="M136 235 C142 208 158 183 181 162"/>
  <path class="arrow" d="M270 119 C305 92 345 73 390 66"/>

  <path class="arrow" d="M450 92 L450 220"/>
  <path class="arrow" d="M705 261 L570 261"/>
  <path class="arrow" d="M450 298 L450 425"/>
  <path class="arrow" d="M195 261 L330 261"/>
</svg>
