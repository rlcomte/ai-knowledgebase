<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Three ways an LLM-based system adapts</title>
  <desc id="desc">Parametric learning changes model weights and persists. Contextual adaptation uses the current context without changing weights. External learning stores experience in memory and retrieves it into future context. A fixed base LLM can therefore support an operationally learning agent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3b6478"/></marker>
    <style>
      .bg{fill:#f8fafc}.band{fill:#e8f0ec}.panel{fill:#fff;stroke:#6a8580;stroke-width:2}.param{fill:#eef6fb;stroke:#39769a;stroke-width:2}.context{fill:#fff9ea;stroke:#b6812e;stroke-width:2}.memory{fill:#ecfdf5;stroke:#15803d;stroke-width:2}.agent{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.title{font:700 27px Arial,sans-serif;fill:#17313b}.subtitle{font:400 15px Arial,sans-serif;fill:#45616a}.label{font:700 18px Arial,sans-serif;fill:#17313b}.text{font:400 14px Arial,sans-serif;fill:#314b55}.small{font:400 12px Arial,sans-serif;fill:#51666c}.arrow{fill:none;stroke:#3b6478;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1120" height="700"/><rect class="band" width="1120" height="92"/>
  <text class="title" x="44" y="43">Adaptation is not always model training</text>
  <text class="subtitle" x="44" y="70">The mechanism determines what changes, how long it lasts, and how it can be governed.</text>

  <rect class="param" x="42" y="128" width="320" height="234" rx="10"/>
  <text class="label" x="68" y="166">1. Parametric learning</text>
  <text class="text" x="68" y="198">training data</text><path class="arrow" d="M120 210v34"/>
  <text class="text" x="68" y="270">gradient descent</text><path class="arrow" d="M120 282v34"/>
  <text class="text" x="68" y="342">model weights change</text>
  <text class="small" x="224" y="342">persistent · expensive</text>

  <rect class="context" x="400" y="128" width="320" height="234" rx="10"/>
  <text class="label" x="426" y="166">2. Contextual adaptation</text>
  <text class="text" x="426" y="198">instructions · examples · documents</text><path class="arrow" d="M560 210v34"/>
  <text class="text" x="426" y="270">context window</text><path class="arrow" d="M478 282v34"/>
  <text class="text" x="426" y="342">LLM weights stay fixed</text>
  <text class="small" x="592" y="342">temporary · fast</text>

  <rect class="memory" x="758" y="128" width="320" height="234" rx="10"/>
  <text class="label" x="784" y="166">3. External learning</text>
  <text class="text" x="784" y="198">experience</text><path class="arrow" d="M826 210v34"/>
  <text class="text" x="784" y="270">memory store → retrieval</text><path class="arrow" d="M870 282v34"/>
  <text class="text" x="784" y="342">future context changes</text>
  <text class="small" x="958" y="342">persistent · inspectable</text>

  <rect class="panel" x="42" y="424" width="1036" height="224" rx="10"/>
  <text class="label" x="68" y="462">Operational learning in an agent with fixed model weights</text>
  <rect class="param" x="78" y="504" width="190" height="80" rx="9"/><text class="label" x="173" y="535" text-anchor="middle">Base LLM</text><text class="small" x="173" y="559" text-anchor="middle">fixed weights</text>
  <rect class="context" x="350" y="488" width="154" height="54" rx="9"/><text class="text" x="427" y="521" text-anchor="middle">context</text>
  <rect class="memory" x="350" y="558" width="154" height="54" rx="9"/><text class="text" x="427" y="591" text-anchor="middle">memory</text>
  <rect class="agent" x="586" y="504" width="176" height="80" rx="9"/><text class="label" x="674" y="551" text-anchor="middle">agent</text>
  <rect class="memory" x="844" y="504" width="190" height="80" rx="9"/><text class="label" x="939" y="535" text-anchor="middle">experience</text><text class="small" x="939" y="559" text-anchor="middle">memory update</text>
  <path class="arrow" d="M268 544h82"/><path class="arrow" d="M504 515h82"/><path class="arrow" d="M504 585c34 0 48-31 82-31"/><path class="arrow" d="M762 544h82"/>
</svg>
